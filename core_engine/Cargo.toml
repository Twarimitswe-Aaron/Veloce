[package]
name = "core_engine"
version = "0.2.0"
edition = "2021"

[lib]
name = "core_engine"
path = "src/lib.rs"

[[bin]]
name = "core_engine"
path = "src/main.rs"

[dependencies]
bytes = "1.12.0"
futures = "0.3.32"
reqwest = { version = "0.13.4", features = ["stream", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
clap = { version = "4.4.11", features = ["derive"] }
anyhow = "1"
indicatif = { version = "0.17", features = ["rayon"] }
crossbeam-queue = "0.3"
url = "2.5"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
tokio = { version = "1.52.3", features = ["full", "test-util"] }
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
